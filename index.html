<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mekanSAL 2027</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4efe2;--tx:#222}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Arial Black",Impact,system-ui,sans-serif}
h1{font-size:clamp(28px,6vw,56px);margin:0;letter-spacing:1px}
header{padding:28px 20px 8px;max-width:1100px;margin:auto}
header .logo{display:block;width:min(520px,92%);height:auto}
#adm{margin-top:10px;font:13px system-ui;display:flex;gap:10px;align-items:center}
#adm:empty{display:none}
header p{font-family:system-ui,sans-serif;opacity:.7;margin:6px 0 0}
#cat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1100px;margin:auto;padding:16px 20px 40px}
@media(max-width:800px){#cat{grid-template-columns:repeat(2,1fr)}}
.card{border:0;cursor:pointer;padding:12px;text-align:left;aspect-ratio:3/4;display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card b{font-size:clamp(26px,5vw,44px);line-height:1;font-family:inherit}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:auto;font:9px system-ui}
.mini i{aspect-ratio:1;font-style:normal;text-align:center;opacity:.8}
.mini i.on{border-radius:2px;opacity:1;color:#000}
#view{display:none;max-width:900px;margin:auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.back{border:2px solid currentColor;background:none;color:inherit;font:inherit;padding:8px 14px;cursor:pointer;border-radius:8px}
.top h1{flex:1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dn{font:700 12px system-ui;text-align:center;opacity:.8}
.day{border:0;border-radius:10px;background:#f1e6c8;color:#1a1a1a;aspect-ratio:1/1.05;padding:6px;text-align:left;cursor:pointer;font-family:inherit;position:relative;overflow:hidden}
.day:hover{outline:3px solid #fff}
.day .n{font-size:clamp(14px,3vw,24px)}
.day .l{position:absolute;left:6px;bottom:5px;right:4px;font-size:clamp(7px,1.6vw,11px);line-height:1.1;text-transform:uppercase}
.day .e{position:absolute;right:4px;top:4px;font-size:clamp(16px,4vw,32px)}
.day.pend{background:transparent;border:2px dashed currentColor;color:inherit}
.blank{visibility:hidden}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:#f1e6c8;color:#1a1a1a;border-radius:16px;padding:22px;max-width:420px;width:100%;font-family:system-ui,sans-serif;max-height:90%;overflow:auto}
.box hr{border:0;border-top:2px dashed #1a1a1a55;margin:14px 0}
.lb{font:700 13px system-ui;margin:8px 0 0}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:2px solid #1a1a1a;border-radius:8px;margin:6px 0;cursor:pointer;background:#fff}
.opt input{width:auto;margin:0}.opt .lk{margin-left:auto}
.note{font-size:12px;line-height:1.4;background:#1a1a1a14;padding:8px 10px;border-radius:8px}
.note.hot{background:#C8432E;color:#fff}
.box .opt input{width:auto;flex:none;margin:0;padding:0;border:0;accent-color:#1a1a1a;background:none}
.opt span{flex:1}.opt span.lk{flex:none}
.lnk{background:none;border:0;color:inherit;opacity:.45;font:12px system-ui;cursor:pointer;text-decoration:underline}
footer{max-width:1100px;margin:auto;padding:0 20px 36px}
.bd{position:absolute;right:5px;top:5px;background:#C8432E;color:#fff;border-radius:99px;font:700 11px system-ui;padding:2px 7px}
.blk{border:2px solid #1a1a1a33;border-radius:12px;padding:12px;margin:10px 0}.blk .who{font-size:13px;margin:0 0 6px}
.box h3{margin:12px 0 4px;font-family:system-ui,sans-serif}
#panel{display:none;max-width:900px;margin:auto;padding:16px 16px 40px;font-family:system-ui,sans-serif}
#panel .top h1{font-family:"Arial Black",Impact,sans-serif}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{border:2px solid #222;background:none;color:#222;border-radius:99px;padding:8px 16px;font:700 13px system-ui;cursor:pointer}.tabs button.on{background:#222;color:#f4efe2}
.rq{background:#fffa;border:2px solid #222;border-radius:12px;padding:14px;margin:12px 0}.rq h3{margin:4px 0}.rq p{margin:6px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pb{background:#222;color:#f4efe2;border:0;border-radius:8px;padding:9px 14px;font:700 13px system-ui;cursor:pointer}
.box .eb{width:36px;height:36px;padding:0;margin:2px;border:2px solid transparent;border-radius:8px;background:#fff;font-size:20px;cursor:pointer;color:inherit}
.box .eb.sel{border-color:#1a1a1a;background:#f1e6c8}
.emo{display:flex;flex-wrap:wrap;margin:0 0 8px}
.err{color:#C8432E;font-weight:700;font-size:13px}
.box .bad{border-color:#C8432E!important;background:#fff0ec!important}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;font:600 14px system-ui;z-index:20;max-width:90%;display:none}
.box h2{margin:0 0 4px;font-family:"Arial Black",Impact,sans-serif}
.box .big{font-size:48px}
.box input,.box textarea,.box select{width:100%;padding:10px;margin:6px 0 10px;border:2px solid #1a1a1a;border-radius:8px;font:inherit;background:#fff;color:#000}
.box button{padding:10px 16px;border-radius:8px;border:0;font:700 14px system-ui;cursor:pointer;background:#1a1a1a;color:#f1e6c8;margin-right:8px}
.box button.g{background:#ddd;color:#000}
.bw{position:absolute;right:5px;bottom:5px;background:#1a1a1a;color:#f1e6c8;border-radius:99px;font:700 11px system-ui;padding:2px 7px}
.day .bd{top:auto;bottom:5px}
.day:has(.e) .bd,.day:has(.e) .bw{top:5px;bottom:auto;left:50%;right:auto;transform:translateX(-50%)}
.day.pw{outline:2px dashed #1a1a1a;outline-offset:-5px}
.mini i.pd{box-shadow:inset 0 0 0 1.5px currentColor;border-radius:2px}
</style></head><body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== AYARLAR: Supabase panelinden alıp yapıştırın (Project Settings > API) =====
const SB_URL="https://PROJE-KODUNUZ.supabase.co",SB_KEY="ANON-PUBLIC-KEY";
// ==================================================================================
const sb=SB_URL.includes("PROJE-KODUNUZ")?null:window.supabase.createClient(SB_URL,SB_KEY);
const MN=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DN=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
// Ekim 2026'dan Aralık 2027'ye kadar 15 ay
const MS=[];for(let i=0;i<15;i++){const t=9+i;MS.push({y:2026+Math.floor(t/12),m:t%12})}
// Sanzo Wada "A Dictionary of Color Combinations" esinli paletler (yaklaşık tonlar): [zemin, yazı, vurgu]
const TH=[["#E9E4D4","#1F3A5F","#D1583A"],["#6B2C3E","#E8A0B5","#E8A0B5"],["#8E8F3F","#F1E0A5","#F1E0A5"],["#D4432E","#3B1F1A","#F2D49B"],["#EBC96B","#2F4F8F","#2F4F8F"],["#E2742F","#FFF1D6","#FFF1D6"],["#F3E8C8","#3E2A1E","#A9472F"],["#C2679A","#2D1B2E","#2D1B2E"],["#2B4C7E","#F2E3B3","#E8B04A"],["#4A3426","#D98A3D","#D98A3D"],["#8DB1C4","#1F3B4D","#1F3B4D"],["#3F4D3A","#E9B7A5","#E9B7A5"]];
const PL=["Atölye","Amfi","Salon (gölet üstü oturma alanı)"],LOCK=p=>p&&p!==PL[0];
const PLC={"Atölye":"#E9B84A","Amfi":"#7FA8B8","Salon (gölet üstü oturma alanı)":"#C8432E"};
const col=x=>PLC[x.place]||"#E9B84A";
const $=s=>document.querySelector(s);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const off=(y,m)=>(new Date(y,m,1).getDay()+6)%7;
const key=(y,m,d)=>y+"-"+(m+1)+"-"+d;
const pc=k=>adminOn?reqList.filter(r=>r.date===k).length:(pend[k]||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dl=k=>{const [y,m,d]=k.split("-").map(Number);return `${d} ${MN[m-1]} ${y}`};
const dsort=(a,b)=>{const f=k=>{const [y,m,d]=k.date.split("-").map(Number);return new Date(y,m-1,d)};return f(a)-f(b)};
let pend={},dw=null,EVENTS={},dyn=[],reqList=[],db=null,uid=null,canWrite=false,ready=false,adminOn=false,cur=-1,pan=false,tab="p",started=false;
function build(){EVENTS={};dyn.forEach(x=>(EVENTS[x.date]??=[]).push(x))}
const vw=n=>["home","view","panel"].forEach(x=>$("#"+x).style.display=x===n?"block":"none");
const plain=()=>{document.body.style.background="";document.body.style.color=""};

function catalog(){
 $("#cat").innerHTML=MS.map(({y,m},i)=>{
  const [bg,tx,ac]=TH[m];
  let g="";for(let j=0;j<off(y,m);j++)g+="<i></i>";
  for(let d=1;d<=dim(y,m);d++){const ev=EVENTS[key(y,m,d)],pe=pc(key(y,m,d))>0;g+=`<i class="${ev?"on":""}${pe?" pd":""}" ${ev?`style="background:${ac}"`:""}>${d}</i>`}
  return `<button class="card" style="background:${bg};color:${tx}" onclick="openMonth(${i})"><b>${MN[m].toLocaleUpperCase("tr").slice(0,3)}</b><span style="font:11px system-ui;margin:4px 0">${y}</span><div class="mini">${g}</div></button>`}).join("");
}
function openMonth(i,keep){
 cur=i;pan=false;const {y,m}=MS[i],[bg,tx]=TH[m];
 document.body.style.background=bg;document.body.style.color=tx;vw("view");
 let h=`<div class="top"><button class="back" onclick="goHome()">← Aylar</button><h1>${MN[m].toLocaleUpperCase("tr")} ${y}</h1>${adminOn?`<button class="back" onclick="showPanel()">Talepler (${reqList.length})</button>`:""}</div><div class="grid">`+DN.map(d=>`<div class="dn">${d}</div>`).join("");
 for(let j=0;j<off(y,m);j++)h+='<div class="blank"></div>';
 for(let d=1;d<=dim(y,m);d++){
  const k=key(y,m,d),ev=EVENTS[k],n=String(d).padStart(2,"0"),pr=pc(k),bd=pr?`<span class="${adminOn?"bd":"bw"}">${adminOn?pr:"⏳ "+pr}</span>`:"";
  if(ev)h+=`<button class="day" style="background:${col(ev[0])}" onclick="openDay(${i},${d})"><span class="n">${n}</span><span class="e">${esc(ev[0].e||"📌")}</span><span class="l">${esc(ev[0].t||ev[0].club)}${ev.length>1?" +"+(ev.length-1):""}</span>${bd}</button>`;
  else h+=`<button class="day${pr?" pw":""}" onclick="openDay(${i},${d})"><span class="n">${n}</span>${bd}</button>`;
 }
 $("#view").innerHTML=h+"</div>";if(!keep)scrollTo(0,0);
}
function goHome(){cur=-1;pan=false;plain();vw("home")}
function show(html){$("#box").innerHTML=html;$("#modal").style.display="flex"}
function closeM(){$("#modal").style.display="none"}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeM()};
let tmr,askFn=null;
const toast=t=>{let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}e.textContent=t;e.style.display="block";clearTimeout(tmr);tmr=setTimeout(()=>e.style.display="none",4500)};
const fail=e=>toast("İşlem yapılamadı"+(e&&e.code?" ("+e.code+")":"")+". Kaydetmek için bu sayfada düzenleme yetkisi gerekiyor.");
const ask=(t,fn)=>{askFn=fn;show(`<p>${t}</p><button onclick="askFn&&askFn()">Evet</button><button class="g" onclick="closeM()">Vazgeç</button>`)};
const emj=v=>{const m=String(v).match(/\p{Regional_Indicator}{2}|\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?)*/u);return m?m[0]:"📌"};
const iso=k=>{const [y,m,d]=k.split("-").map(Number);return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`};
const unkey=v=>{const [y,m,d]=v.split("-").map(Number);return `${y}-${m}-${d}`};

function viewEv(x){return `<div class="big">${esc(x.e||"📌")}</div><h2>${esc(x.t||x.club)}</h2><p><small>${[x.time,x.count?x.count+" kişi":"",x.place].filter(Boolean).map(esc).join(" · ")}</small></p><p>${esc(x.detail??x.d)}</p>`}
function blk(id,o,top,btns,dt){return `<div class="blk" id="b_${id}">${top}<input class="fe" placeholder="Emoji (kendi emojini yaz)" maxlength="12" value="${esc(o.e)}"><input class="ft" placeholder="Kulüp / etkinlik adı" value="${esc(o.t||o.club)}">${dt?`<label class="lb">Tarih</label><input class="fdt" type="date" min="2026-10-01" max="2027-12-31" value="${iso(o.date)}">`:""}<label class="lb">Saat</label><input class="fm" type="time" value="${esc(o.time)}"><input class="fc" type="number" min="1" placeholder="Kişi sayısı" value="${esc(o.count)}"><select class="fp">${PL.map(p=>`<option ${p===o.place?"selected":""}>${p}</option>`).join("")}</select><textarea class="fd" rows="3" placeholder="Etkinlik detayı">${esc(o.detail??o.d)}</textarea><div>${btns}</div></div>`}
function rd(id){const b=$("#b_"+id),g=c=>b.querySelector("."+c).value.trim(),t=g("ft"),dt=b.querySelector(".fdt"),o={e:emj(g("fe")),t,club:t,time:g("fm"),count:g("fc"),place:g("fp"),detail:g("fd")};if(dt&&dt.value)o.date=unkey(dt.value);return o}
const evBlk=x=>blk("e"+x.id,x,"",`<button onclick="saveEv('${x.id}')">Kaydet</button><button class="g" onclick="delEv('${x.id}')">Sil</button>`,1);
const reqBlk=r=>blk("r"+r.id,r,`<p class="who">${esc(r.name)} · <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>${LOCK(r.place)?"<br><b>🔒 Yüz yüze görüşme gerekli</b>":""}</p>`,`<button onclick="okReq('${r.id}')">Onayla</button><button class="g" onclick="rejReq('${r.id}')">Reddet</button>`,1);
function editEv(id){const x=dyn.find(z=>z.id===id);if(x)show(`<h2>${dl(x.date)}</h2>`+evBlk(x)+`<button class="g" onclick="closeM()">Kapat</button>`)}
function editReq(id){const r=reqList.find(z=>z.id===id);if(r)show(`<h2>${dl(r.date)}</h2>`+reqBlk(r)+`<button class="g" onclick="closeM()">Kapat</button>`)}

function openDay(i,d){
 const {y,m}=MS[i],k=key(y,m,d),ds=`${d} ${MN[m]} ${y}`,evs=EVENTS[k]||[];
 if(adminOn){
  const prs=reqList.filter(r=>r.date===k);
  let h=`<h2>${ds}</h2>`;
  if(prs.length)h+=`<h3>Bekleyen talepler</h3>`+prs.map(reqBlk).join("");
  if(evs.length)h+=`<h3>Onaylı etkinlikler</h3>`+evs.map(evBlk).join("");
  h+=`<h3>Yeni etkinlik ekle</h3>`+blk("new",{place:PL[0]},"",`<button onclick="addEv('${k}')">Ekle</button>`);
  return show(h+`<button class="g" onclick="closeM()">Kapat</button>`);
 }
 if(evs.length)return show(`<p><b>${ds}</b></p>`+evs.map(viewEv).join("<hr>")+`<button onclick="closeM()">Kapat</button>`);
 show(`<h2>Etkinlik talebi</h2><p><b>${ds}</b></p>${pc(k)?`<p class="note">⏳ Bu gün için <b>${pc(k)}</b> bekleyen talep var. Yine de talep oluşturabilirsiniz.</p>`:""}
 <input id="f1" placeholder="Adınız"><input id="f2" placeholder="Kulüp adı"><input id="f6" type="tel" placeholder="Telefon numarası">
 <label class="lb">Saat</label><input id="f3" type="time"><input id="f4" type="number" min="1" placeholder="Kaç kişi katılacak?">
 <textarea id="f5" rows="3" placeholder="Etkinlik detayı"></textarea>
 <p class="lb">Etkinlik emojisi</p><input class="fe" id="f7" placeholder="Kendi emojini yaz (örn. 🎭)" maxlength="12">
 <p class="lb">Etkinlik yeri</p>

 <label class="opt"><input type="radio" name="pl" data-name="Amfi" data-lock="1" onchange="pick()"><span>Amfi</span><span class="lk">🔒</span></label>
 <label class="opt"><input type="radio" name="pl" data-name="Salon (gölet üstü oturma alanı)" data-lock="1" onchange="pick()"><span>Salon <small>(gölet üstü oturma alanı)</small></span><span class="lk">🔒</span></label>
 <p class="note" id="lk">🔒 Kilitli yerler özel seçimdir. Amfi veya Salon seçilirse etkinliğin onaylanması için yüz yüze görüşme gerekir.</p>
 <p class="err" id="er" style="display:none"></p>
 <button id="sb" onclick="send(${i},${d})">Talep Gönder</button><button class="g" onclick="closeM()">Vazgeç</button>`);
}
function pick(){const r=document.querySelector("input[name=pl]:checked");$("#lk").classList.toggle("hot",!!r&&r.dataset.lock==="1")}
// --- Supabase veri katmanı ---
const fromRow=r=>({id:r.id,status:r.status,date:unkey(r.date),e:r.emoji||"📌",t:r.club,club:r.club,time:(r.time||"").slice(0,5),count:r.count??"",place:r.place,detail:r.detail,name:r.name,phone:r.phone,lock:r.lock});
const row=o=>({emoji:o.e,club:o.club,time:o.time,count:+o.count||null,place:o.place,detail:o.detail,...(o.date?{date:iso(o.date)}:{})});
let session=null;
async function load(){
 if(!sb)return;
 adminOn=false;
 if(session){try{const r=await sb.rpc("is_admin");adminOn=r.data===true}catch(e){}}
 if(adminOn){
  const {data,error}=await sb.from("requests").select("*").order("date");
  if(!error){const all=data.map(fromRow);reqList=all.filter(x=>x.status==="pending");dyn=all.filter(x=>x.status==="approved")}
 }else{
  reqList=[];const {data,error}=await sb.from("public_events").select("*");
  if(!error)dyn=data.map(fromRow);
  const pr=await sb.from("public_pending_days").select("*");pend={};if(!pr.error)pr.data.forEach(x=>pend[unkey(x.date)]=x.n);
 }
 rerender();
}
async function send(i,d){
 const v=n=>$("#f"+n).value.trim(),{y,m}=MS[i],pl=document.querySelector("input[name=pl]:checked"),er=(t,x)=>{const o=$("#er");o.textContent=t;o.style.display="block";if(x){const ta=document.createElement("textarea");ta.readOnly=true;ta.rows=7;ta.value=x;ta.onfocus=()=>ta.select();o.after(ta)}};
 document.querySelectorAll(".box .bad").forEach(x=>x.classList.remove("bad"));
 const miss=[[1,"Adınız"],[2,"Kulüp adı"],[6,"Telefon"],[3,"Saat"],[4,"Kişi sayısı"],[5,"Etkinlik detayı"]].filter(a=>!v(a[0]));
 miss.forEach(a=>$("#f"+a[0]).classList.add("bad"));
 if(miss.length||!pl)return er("Eksik alanlar: "+miss.map(a=>a[1]).concat(pl?[]:["Etkinlik yeri"]).join(", ")+".");
 if(!sb)return er("Site henüz Supabase'e bağlanmamış (index.html içindeki ayarları doldurun).");
 const b=$("#sb");b.disabled=true;b.textContent="Gönderiliyor…";
 const lock=pl.dataset.lock==="1",dt=iso(key(y,m,d));
 const txt=`Etkinlik talebi\nTarih: ${dl(key(y,m,d))} ${v(3)}\nKulüp: ${v(2)}\nAd: ${v(1)} · ${v(6)}\nKişi: ${v(4)}\nYer: ${pl.dataset.name}\nDetay: ${v(5)}`;
 const {error}=await sb.from("requests").insert({status:"pending",date:dt,name:v(1),club:v(2),phone:v(6),time:v(3),count:+v(4),detail:v(5),emoji:emj(v(7)),place:pl.dataset.name,lock});
 if(error){b.disabled=false;b.textContent="Talep Gönder";return er("Talep gönderilemedi: "+error.message+". Aşağıdaki metni kopyalayıp yöneticiye iletebilirsiniz.",txt)}
 load();show(`<h2>Talebiniz gönderildi ✓</h2>${lock?"<p>Seçtiğiniz yer özel seçim olduğu için onaydan önce yüz yüze görüşme yapılacak.</p>":""}<button onclick="closeM()">Tamam</button>`);
}
// --- yönetici işlemleri ---
async function run(p,ok){const {error}=await p;if(error)return toast("İşlem yapılamadı: "+error.message);closeM();toast(ok);await load()}
function addEv(k){const o=rd("new");if(!o.t)return toast("Kulüp adı gerekli.");run(sb.from("requests").insert({...row(o),date:iso(k),status:"approved"}),"Etkinlik eklendi ✓")}
function saveEv(id){const o=rd("e"+id);if(!o.t)return toast("Kulüp adı gerekli.");run(sb.from("requests").update(row(o)).eq("id",id),"Kaydedildi ✓")}
function delEv(id){ask("Bu etkinlik silinsin mi?",()=>run(sb.from("requests").delete().eq("id",id),"Silindi"))}
function okReq(id){const r=reqList.find(x=>x.id===id);if(!r)return;
 const o=$("#b_r"+id)?rd("r"+id):{e:r.e,club:r.club,t:r.club,time:r.time,count:r.count,place:r.place,detail:r.detail};
 if(!o.t)return toast("Kulüp adı gerekli.");
 run(sb.from("requests").update({...row(o),status:"approved"}).eq("id",id),"Onaylandı ✓")}
function rejReq(id){ask("Talep reddedilsin mi?",()=>run(sb.from("requests").update({status:"rejected"}).eq("id",id),"Talep reddedildi"))}
function gotoDay(date){const [y,m,d]=date.split("-").map(Number),i=MS.findIndex(s=>s.y===y&&s.m===m-1);if(i<0)return toast("Bu tarih takvim aralığında değil.");openMonth(i);openDay(i,d)}
function showPanel(t){
 if(t)tab=t;pan=true;plain();vw("panel");
 const list=(tab==="p"?reqList:dyn).slice().sort(dsort);
 const card=x=>`<div class="rq"><b>${dl(x.date)}</b><h3>${esc(x.e||"📌")} ${esc(x.t||x.club)}</h3><p>${[x.time,x.count?x.count+" kişi":"",x.place].filter(Boolean).map(esc).join(" · ")}${LOCK(x.place)?" 🔒":""}</p>${x.name?`<p>${esc(x.name)} · <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></p>`:""}<p>${esc(x.detail??x.d)}</p>${tab==="p"&&LOCK(x.place)?"<p><b>Yüz yüze görüşme gerekli.</b></p>":""}<div class="acts"><button class="pb" onclick="${tab==="p"?"editReq":"editEv"}('${x.id}')">${tab==="p"?"İncele / düzenle":"Düzenle"}</button>${tab==="p"?`<button class="pb" onclick="okReq('${x.id}')">Onayla</button><button class="back" onclick="rejReq('${x.id}')">Reddet</button>`:""}<button class="back" onclick="gotoDay('${x.date}')">Takvimde aç</button></div></div>`;
 $("#panel").innerHTML=`<div class="top"><button class="back" onclick="goHome()">← Takvim</button><h1>YÖNETİCİ PANELİ</h1></div><div class="tabs"><button class="${tab==="p"?"on":""}" onclick="showPanel('p')">Bekleyen (${reqList.length})</button><button class="${tab==="o"?"on":""}" onclick="showPanel('o')">Onaylanan (${dyn.length})</button></div>`+(list.length?list.map(card).join(""):`<p>${tab==="p"?"Bekleyen talep yok.":"Henüz onaylanmış etkinlik yok."}</p>`);
 scrollTo(0,0);
}
function adminBar(){$("#adm").innerHTML=adminOn?`<span>Yönetici: ${esc(session&&session.user.email)}</span><button class="back" onclick="showPanel()">Talepler (${reqList.length})</button><button class="back" onclick="logout()">Çıkış</button>`:""}
function rerender(){build();catalog();adminBar();if(cur>=0&&!pan)openMonth(cur,1);if(pan){const y=scrollY;showPanel();scrollTo(0,y)}}
// --- giriş ---
function loginBox(){show(`<h2>Yönetici girişi</h2><input id="lu" type="email" placeholder="E-posta" autocomplete="username"><input id="lp" type="password" placeholder="Şifre" autocomplete="current-password"><p id="le" class="note" style="display:none">E-posta veya şifre hatalı.</p><button onclick="doLogin()">Giriş</button><button class="g" onclick="closeM()">Vazgeç</button>`)}
async function doLogin(){
 if(!sb)return;
 const {error}=await sb.auth.signInWithPassword({email:$("#lu").value.trim(),password:$("#lp").value});
 if(error){$("#le").style.display="block";return}
 closeM();
}
async function logout(){if(sb)await sb.auth.signOut();pan=false;goHome()}
(async()=>{
 build();catalog();adminBar();
 if(!sb)return;
 const r=await sb.auth.getSession();session=r.data.session;
 sb.auth.onAuthStateChange((_e,s)=>{session=s;load()});
 await load();
 setInterval(load,60000);
})();
</script></body></html>
